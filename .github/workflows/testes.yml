name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portao
          POSTGRES_PASSWORD: portao
          POSTGRES_DB: portao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portao"
          --health-interval 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://portao:portao@localhost:5432/portao
      PORTAO_CHAVE: chave-de-teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
